{{- $svc := index .Values.global "notification-service" -}}
{{- $imageValues := index .Values "notification-service" | default dict -}}
{{- $image := index $imageValues "image" | default dict -}}
{{- $imageRepository := index $image "repository" | default $svc.image.repository -}}
{{- $imageTag := index $image "tag" | default $svc.image.tag -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-service
  namespace: {{ .Values.global.namespace }}
  labels:
    app: notification-service
spec:
  replicas: {{ $svc.replicaCount }}
  selector:
    matchLabels:
      app: notification-service
  template:
    metadata:
      labels:
        app: notification-service
    spec:
      containers:
        - name: notification-service
          image: "{{ $imageRepository }}:{{ $imageTag }}"
          imagePullPolicy: {{ $svc.imagePullPolicy }}
          ports:
            - containerPort: {{ $svc.containerPort }}
          envFrom:
            - configMapRef:
                name: notification-service-config
            - secretRef:
                name: notification-service-secret
          readinessProbe:
{{- toYaml $svc.readinessProbe | nindent 12 }}
          livenessProbe:
{{- toYaml $svc.livenessProbe | nindent 12 }}
          resources:
{{- toYaml $svc.resources | nindent 12 }}
