{{- $svc := index .Values.global "frontend" -}}
{{- $imageValues := index .Values "frontend" | default dict -}}
{{- $image := index $imageValues "image" | default dict -}}
{{- $imageRepository := index $image "repository" | default $svc.image.repository -}}
{{- $imageTag := index $image "tag" | default $svc.image.tag -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: {{ .Values.global.namespace }}
  labels:
    app: frontend
spec:
  replicas: {{ $svc.replicaCount }}
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: "{{ $imageRepository }}:{{ $imageTag }}"
          imagePullPolicy: {{ $svc.imagePullPolicy }}
          ports:
            - containerPort: {{ $svc.containerPort }}
          envFrom:
            - configMapRef:
                name: frontend-config
          readinessProbe:
{{- toYaml $svc.readinessProbe | nindent 12 }}
          livenessProbe:
{{- toYaml $svc.livenessProbe | nindent 12 }}
          resources:
{{- toYaml $svc.resources | nindent 12 }}
