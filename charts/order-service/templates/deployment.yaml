{{- $svc := index .Values.global "order-service" -}}
{{- $imageValues := index .Values "order-service" | default dict -}}
{{- $image := index $imageValues "image" | default dict -}}
{{- $imageRepository := index $image "repository" | default $svc.image.repository -}}
{{- $imageTag := index $image "tag" | default $svc.image.tag -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service
  namespace: {{ .Values.global.namespace }}
  labels:
    app: order-service
spec:
  replicas: {{ $svc.replicaCount }}
  selector:
    matchLabels:
      app: order-service
  template:
    metadata:
      labels:
        app: order-service
    spec:
      containers:
        - name: order-service
          image: "{{ $imageRepository }}:{{ $imageTag }}"
          imagePullPolicy: {{ $svc.imagePullPolicy }}
          ports:
            - containerPort: {{ $svc.containerPort }}
          envFrom:
            - configMapRef:
                name: order-service-config
            - secretRef:
                name: order-service-secret
          readinessProbe:
{{- toYaml $svc.readinessProbe | nindent 12 }}
          livenessProbe:
{{- toYaml $svc.livenessProbe | nindent 12 }}
          resources:
{{- toYaml $svc.resources | nindent 12 }}
